# Configuration WinApps. Script Bash, relu à chaque lancement.
# Options : https://github.com/winapps-org/winapps

# Compte Windows : nom et mot de passe lus dans .env.
RDP_USER="$(sed -n 's/^WIN_USERNAME=//p' "${HOME}/.config/winapps/.env" 2>/dev/null)"
RDP_USER="${RDP_USER:-$USER}"
RDP_PASS=""
RDP_ASKPASS="${HOME}/.config/winapps/winapps-askpass"
RDP_DOMAIN=""

RDP_IP="127.0.0.1"
RDP_PORT="3389"
WAFLAVOR="docker"

RDP_SCALE="100"
REMOVABLE_MEDIA="/run/media"
RDP_FLAGS="/cert:tofu +clipboard"
RDP_FLAGS_NON_WINDOWS=""
RDP_FLAGS_WINDOWS=""
HIDEF="on"

DEBUG="false" # true : journal dans ~/.local/share/winapps/winapps.log
AUTOPAUSE="on"
AUTOPAUSE_TIME="300"

# sdl-freerdp en Wayland natif, avec les correctifs du presse-papiers.
FREERDP_COMMAND="${HOME}/.config/winapps/winapps-freerdp"

PORT_TIMEOUT="5"
RDP_TIMEOUT="30"
APP_SCAN_TIMEOUT="60"
BOOT_TIMEOUT="120"
